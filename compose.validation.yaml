# Local validation only; uses the isolated test database in the existing PostgreSQL container.
name: bookstreet-validation
services:
  api:
    build:
      context: ./DuongSach-BE
      dockerfile: Dockerfile.validation
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password123@host.docker.internal:5434/duongsach_validation_test?schema=public
      JWT_ACCESS_SECRET: local-validation-access-secret-only
      JWT_REFRESH_SECRET: local-validation-refresh-secret-only
      PUBLIC_SITE_URL: http://localhost:8081
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "127.0.0.1:4001:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build:
      context: ./DuongSach-FE
      dockerfile: Dockerfile.validation
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
